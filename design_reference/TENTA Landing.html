<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>TENTA — Landing Page Eksplorasi</title>
<link rel="stylesheet" href="styles.css"/>
<style>
  html, body { margin: 0; padding: 0; background: #f0eee9; overflow: hidden; height: 100vh; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", system-ui, sans-serif; }
  #root { height: 100vh; }
  /* Recolor tokens live via root var overrides from Tweaks */
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="design-canvas.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel" src="v1-modern.jsx"></script>
<script type="text/babel" src="v2-editorial.jsx"></script>
<script type="text/babel" src="v3-agency.jsx"></script>

<script type="text/babel" data-presets="react">
const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "primary500": "#FF7A1A",
  "primary400": "#FF9240",
  "primary600": "#F06200",
  "primary300": "#FFAD6B",
  "primary100": "#FFE6D1",
  "primary50":  "#FFF4EC"
}/*EDITMODE-END*/;

// Helper: derive shade variants from primary 500 (simple lightness mix)
function mix(hex, white, ratio) {
  const h = hex.replace('#','');
  const r = parseInt(h.substring(0,2), 16);
  const g = parseInt(h.substring(2,4), 16);
  const b = parseInt(h.substring(4,6), 16);
  const [wr, wg, wb] = white ? [255,255,255] : [0,0,0];
  const mixC = (c, w) => Math.round(c + (w - c) * ratio);
  return '#' + [mixC(r,wr), mixC(g,wg), mixC(b,wb)].map(v => v.toString(16).padStart(2,'0')).join('');
}

function App() {
  const [t, setTweak] = useTweaks(TWEAK_DEFAULTS);

  // Apply tokens to :root so all 3 variations re-theme live
  React.useEffect(() => {
    const root = document.documentElement.style;
    root.setProperty('--tenta-500', t.primary500);
    root.setProperty('--tenta-600', mix(t.primary500, false, 0.15));   // darker
    root.setProperty('--tenta-700', mix(t.primary500, false, 0.32));
    root.setProperty('--tenta-400', mix(t.primary500, true,  0.25));
    root.setProperty('--tenta-300', mix(t.primary500, true,  0.45));
    root.setProperty('--tenta-200', mix(t.primary500, true,  0.65));
    root.setProperty('--tenta-100', mix(t.primary500, true,  0.82));
    root.setProperty('--tenta-50',  mix(t.primary500, true,  0.93));
  }, [t.primary500]);

  return (
    <>
      <DesignCanvas>
        <DCSection id="v1" title="V1 · Modern Minimal" subtitle="Geist sans · hero image kanan · product card clean">
          <DCArtboard id="v1-main" label="A · Modern Minimal" width={1280} height={3400}>
            <V1/>
          </DCArtboard>
        </DCSection>

        <DCSection id="v2" title="V2 · Editorial Elegant" subtitle="Fraunces serif + Manrope · hero centered · service cards bold">
          <DCArtboard id="v2-main" label="B · Editorial Elegant" width={1280} height={3800}>
            <V2/>
          </DCArtboard>
        </DCSection>

        <DCSection id="v3" title="V3 · Digital Marketing Agency" subtitle="8 services · stats strip · process · case studies · industries · pricing 3-tier · FAQ">
          <DCArtboard id="v3-main" label="C · Agency Full-Service" width={1280} height={5600}>
            <V3/>
          </DCArtboard>
        </DCSection>
      </DesignCanvas>

      <TweaksPanel title="Tweaks · TENTA">
        <TweakSection label="Warna Primary">
          <TweakColor  label="Orange utama"   value={t.primary500} onChange={(v) => setTweak('primary500', v)} />
        </TweakSection>
        <TweakSection label="Preset Cepat">
          <div style={{ display: 'grid', gridTemplateColumns: 'repeat(4, 1fr)', gap: 6 }}>
            {[
              ['#FF7A1A', 'Cerah'],
              ['#FF6B35', 'Coral'],
              ['#FF9240', 'Soft'],
              ['#F06200', 'Deep'],
            ].map(([hex, lbl]) => (
              <button key={hex} onClick={() => setTweak('primary500', hex)}
                style={{ background: hex, border: t.primary500 === hex ? '2px solid #000' : '1px solid rgba(0,0,0,.15)', borderRadius: 6, height: 28, cursor: 'pointer', color: '#fff', fontSize: 10, fontWeight: 600, fontFamily: 'inherit', padding: 0 }}>{lbl}</button>
            ))}
          </div>
        </TweakSection>
        <TweakSection label="Info">
          <div style={{ fontSize: 11, color: 'rgba(41,38,27,.6)', lineHeight: 1.5 }}>
            Semua shade (50-700) auto-generate dari warna utama. Coba warna lain dengan color picker atau preset di atas. Semua variasi (A, B, C) ikut berubah.
          </div>
        </TweakSection>
      </TweaksPanel>
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
